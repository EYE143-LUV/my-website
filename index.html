<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Squad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="landing">
  <main class="hero">
    <h1 class="title">HI KONGKHAM</h1>

    <form id="nameForm" class="name-form" novalidate>
      <label for="nameInput" class="sr-only">Your name</label>
      <input id="nameInput" type="text" placeholder="Enter your name"
             maxlength="40" autocomplete="off" autocapitalize="words" spellcheck="false">
      <p class="hint">Enter letters only (A-Z)</p>
      <p id="error" class="error" role="alert" aria-live="polite"></p>
      <button type="submit" class="btn">ENTER</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
